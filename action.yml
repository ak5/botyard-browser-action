name: Botyard browser lease
description: Acquire a disposable Botyard Chromium browser and release it after the job
inputs:
  api-url:
    description: Botyard API base URL
    required: true
  api-key:
    description: Narrow Botyard API key with browser:lease capability
    required: true
  ttl-minutes:
    description: Hard browser lease TTL
    required: false
    default: '30'
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
  post-if: always()
